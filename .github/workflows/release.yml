name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTEND_IMAGE: ghcr.io/matthew-kabiu/jobflow-frontend
  BACKEND_IMAGE: ghcr.io/matthew-kabiu/jobflow-backend

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'Matthew-kabiu/JobFlow'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - name: Install existing DOM smoke dependency
        run: npm ci --prefix code/frontend --ignore-scripts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./code
          file: ./code/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend.outputs.tags }}
          labels: ${{ steps.frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./code
          file: ./code/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend.outputs.tags }}
          labels: ${{ steps.backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Smoke-test anonymously pulled published images
        run: node code/scripts/smoke-release.mjs "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # GitHub normalizes leading-dot asset names; use explicit stable names.
          cp .env.example default.env.example
          cp .env.development.example default.env.development.example
          gh release create "$GITHUB_REF_NAME" \
            docker-compose.yml default.env.example default.env.development.example README.md \
            --verify-tag --title "JobFlow $GITHUB_REF_NAME" --generate-notes \
            --notes "Frontend: ${FRONTEND_IMAGE}:${VERSION}
          Backend: ${BACKEND_IMAGE}:${VERSION}
          Platform: linux/amd64. Configure runtime values using the attached examples.
          Existing frontend dependency audit findings are documented in docs/RELEASING.md."

  mirror:
    if: github.repository == 'Spooky-Organization/JobFlow'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for canonical release and mirror its images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          READY=false
          for attempt in $(seq 1 80); do
            if gh release view "$GITHUB_REF_NAME" --repo Matthew-kabiu/JobFlow >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 15
          done
          test "$READY" = true
          VERSION="${GITHUB_REF_NAME#v}"
          cp .env.example default.env.example
          cp .env.development.example default.env.development.example
          gh release create "$GITHUB_REF_NAME" \
            docker-compose.yml default.env.example default.env.development.example README.md \
            --verify-tag --title "JobFlow $GITHUB_REF_NAME" --generate-notes \
            --notes "Canonical release: https://github.com/Matthew-kabiu/JobFlow/releases/tag/${GITHUB_REF_NAME}
          Frontend: ${FRONTEND_IMAGE}:${VERSION}
          Backend: ${BACKEND_IMAGE}:${VERSION}
          Images are built once by the public repository and reused here."
